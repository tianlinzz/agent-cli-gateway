name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Lint code
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          LINT_BIN="$(go env GOPATH)/bin/golangci-lint"

          run_lint() {
            "$LINT_BIN" run "$@" || {
              code=$?
              # exit code 5 = "no go files to analyze" (e.g. only non-Go files changed) — not a lint failure
              [ "$code" -eq 5 ] && return 0
              return "$code"
            }
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            run_lint --new-from-rev "origin/${{ github.base_ref }}" ./...
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            run_lint --new-from-rev "${{ github.event.before }}" ./...
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            run_lint --new-from-rev "$(git rev-parse HEAD^)" ./...
          else
            run_lint ./...
          fi

      - name: Lint GitHub workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          "$(go env GOPATH)/bin/actionlint" -color

  unit-test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""

      - name: Verify module checksums
        run: go mod verify
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  race-test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests with race detector
        run: go test -race ./...

  cross-build:
    # Cross-platform build is a project invariant: the darwin dev host, Linux
    # production, and Windows dev are all supported. Verify the whole module
    # (including test files via vet) builds for Linux and Windows.
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build for linux
        run: GOOS=linux go build ./...

      - name: Build for windows
        run: GOOS=windows go build ./...

      - name: Vet for linux
        run: GOOS=linux go vet ./...

      - name: Vet for windows
        run: GOOS=windows go vet ./...

  integration-test:
    # Hermetic container-level E2E: real HTTP API → real supervisor → real
    # (stub) worker child. No agent CLI and no real nsjail needed, so it runs
    # on any runner. Replaces the old tests/e2e + tests/performance jobs,
    # which referenced directories deleted in the gateway rewrite.
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run integration tests
        run: go test ./integration/ -v

  docker-smoke:
    # Linux-only nsjail smoke: builds the multi-stage image (which compiles
    # google/nsjail from a pinned tag — cannot run on a darwin host) and runs
    # docker/nsjail-smoke.sh (nsjail --version, ldd, minimal jail) inside the
    # built image. Advisory (`continue-on-error`) so a transient network hiccup
    # in the nsjail-builder stage never blocks merges; the compile path itself
    # is deterministic (pinned nsjail tag + pinned debian base).
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t agent-gateway:ci .

      - name: Run nsjail smoke validation
        run: |
          docker run --rm --entrypoint /bin/sh \
            --privileged \
            -v "$PWD/docker/nsjail-smoke.sh:/nsjail-smoke.sh:ro" \
            agent-gateway:ci /nsjail-smoke.sh
