name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Lint code
        run: |
          set -euo pipefail
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          LINT_BIN="$(go env GOPATH)/bin/golangci-lint"

          run_lint() {
            "$LINT_BIN" run "$@" || {
              code=$?
              # exit code 5 = "no go files to analyze" (e.g. only non-Go files changed) — not a lint failure
              [ "$code" -eq 5 ] && return 0
              return "$code"
            }
          }

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            run_lint --new-from-rev "origin/${{ github.base_ref }}" ./...
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            run_lint --new-from-rev "${{ github.event.before }}" ./...
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            run_lint --new-from-rev "$(git rev-parse HEAD^)" ./...
          else
            run_lint ./...
          fi

      - name: Lint GitHub workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.8
          "$(go env GOPATH)/bin/actionlint" -color

  unit-test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""

      - name: Verify module checksums
        run: go mod verify
        env:
          GOPROXY: https://proxy.golang.org,direct
          GOSUMDB: sum.golang.org
          GONOSUMDB: ""

      - name: Enforce architecture boundaries
        run: go test ./internal/archtest/ -v

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with coverage
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: github.event_name == 'push'
        with:
          files: ./coverage.out
          fail_ci_if_error: false

  race-test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run tests with race detector
        run: go test -race ./...

  cross-build:
    # Cross-platform build is a project invariant: the darwin dev host, Linux
    # production, and Windows dev are all supported. Verify the whole module
    # (including test files via vet) builds for Linux and Windows.
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build for linux arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...

      - name: Build for windows amd64
        run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...

  integration-test:
    # Hermetic container-level E2E: real HTTP API → real supervisor → real
    # (stub) worker child. No agent CLI and no real nsjail needed, so it runs
    # on any runner. Replaces the old tests/e2e + tests/performance jobs,
    # which referenced directories deleted in the gateway rewrite.
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Run integration tests
        run: go test ./integration/ -v

  docker-smoke:
    # Required Linux release gate: build the pinned nsjail image and execute
    # version, linkage, preflight, and minimal-jail validation. This job is
    # intentionally blocking; isolation regressions must prevent a merge.
    #
    # The gate is NON-PRIVILEGED: it runs the documented production security
    # context (non-root 65532, cap-drop=ALL, no-new-privileges) so the claim
    # "unprivileged user namespace + mount + PID namespace, no --privileged" is
    # actually proven by CI, not just asserted in docs. If the runner kernel
    # blocks unprivileged user namespaces, the deployment contract must be
    # revised explicitly — never silently add --privileged back.
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t agent-gateway:ci .

      - name: Run nsjail smoke validation (non-privileged)
        run: |
          docker run --rm --entrypoint /bin/sh \
            --user 65532:65532 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --read-only \
            --tmpfs /tmp \
            -v "$PWD/docker/nsjail-smoke.sh:/nsjail-smoke.sh:ro" \
            agent-gateway:ci /nsjail-smoke.sh

  smoke-arm64:
    # Architecture-specific sandbox gate (O-F06): a cross-build alone does not
    # prove the seccomp policy or nsjail run on arm64. This runs the same
    # non-privileged smoke on a real arm64 runner so the aarch64 Kafel policy
    # is exercised against actual arm64 syscalls, not just compiled.
    runs-on: ubuntu-24.04-arm
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Build image (arm64)
        run: docker build -t agent-gateway:ci-arm64 .

      - name: Run nsjail smoke validation (arm64, non-privileged)
        run: |
          docker run --rm --entrypoint /bin/sh \
            --user 65532:65532 \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --read-only \
            --tmpfs /tmp \
            -v "$PWD/docker/nsjail-smoke.sh:/nsjail-smoke.sh:ro" \
            agent-gateway:ci-arm64 /nsjail-smoke.sh
