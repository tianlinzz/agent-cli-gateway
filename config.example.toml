# agent-cli-gateway configuration. Run `gateway -config gateway.toml`, or omit
# --config for built-in defaults (prod profile, isolation required).
# See README.md for the full field reference.

# Runtime profile: "prod" (default), "dev", or "test". nsjail isolation is
# mandatory in prod and dev; only the "test" profile may disable it
# (isolation.required = false).
mode = "prod"

[server]
listen_addr = ":4096"
drain_timeout = "30s"
# HTTP listener hardening (O-F07): bound slow-header/keep-alive abuse without
# breaking long-lived SSE turns (WriteTimeout/ReadTimeout are deliberately unset).
read_header_timeout = "10s"
idle_timeout = "60s"
max_header_bytes = 1048576
# Gateway run deadline for a single turn (O-F09b): the default bound honored
# by every adapter unless agents.<id>.timeout overrides it. When it fires the
# worker aborts the native turn and the API presents a unified timeout error
# (HTTP 504 / SSE error frame, code "turn_timeout"). 0 disables it. Default 10m.
# turn_timeout = "10m"

[worker]
stop_grace_period = "10s"
heartbeat_interval = "15s"
heartbeat_timeout = "3s"
heartbeat_failures = 3

[sessions]
# Reclaims only the disposable Worker/Agent process. Gateway conversation
# identity and the native session ID remain available for recovery.
idle_timeout = "2h"
reap_interval = "1m"
# How long a session record (and its native session ID) is retained after the
# last activity before the background prune loop evicts it and drops its cached
# worker handle. MUST exceed idle_timeout so a record survives worker
# reclamation and can still resume. Default 168h.
record_ttl = "168h"
# How long a terminal run record (one Agent turn) is retained before the same
# prune loop deletes it, bounding in-memory run growth. Default 24h.
# run_record_ttl = "24h"

[limits]
# Admission control and resource caps (O-F10). All default to 0 (unlimited).
# Positive values reject excess work with HTTP 429 + Retry-After.
# Global cap on live worker processes (one per session).
# max_workers = 100
# Global cap on concurrently executing turns across all callers.
# max_active_runs = 100
# Per-caller cap on live session records.
# max_sessions_per_caller = 50
# Per-caller cap on concurrently executing turns.
# max_active_runs_per_caller = 10
# Per-workspace cap on concurrently executing turns.
# max_active_runs_per_workspace = 4
# Global cap on live session records across all callers (enforced atomically
# at session creation; excess requests get 429).
# max_sessions = 1000
# Per-worker on-disk log file cap. When exceeded the log is truncated with a
# marker; the file never exceeds the cap after a check, but may overshoot by
# up to one check interval of writes in between. Default 64 MiB.
max_worker_log_bytes = 67108864
# How often each worker's log size is checked against max_worker_log_bytes.
# Default 5s.
# worker_log_check_interval = "5s"

[auth]
# Tokens authenticate callers, not end users. Health probes are always
# unauthenticated. Production requires at least one caller.
callers = [{ id = "example-client", tokens = ["change-me"] }]

[workspace]
# INFRASTRUCTURE CONTRACT (O-F10): the gateway bounds processes (max_workers),
# logs (max_worker_log_bytes), sessions (max_sessions*), /tmp per session
# (isolation.mounts.tmpfs_size_mib), and per-file write sizes
# (isolation.rlimits.max_file_bytes). TOTAL workspace-filesystem usage is
# enforced OUTSIDE the gateway: mount the workspace root on a quota-capable
# filesystem (project quotas, XFS/ZFS refquota, or per-volume size limits) —
# the writable bind mount alone cannot bound aggregate disk usage.
# Directory all opaque workspace_ids resolve under. Only the server owns this
# path; clients reference workspaces by opaque ID and can never inject a path.
root = "/srv/workspaces"

[isolation]
# nsjail sandbox boundary (phase 1). The gateway forks one nsjail-wrapped
# worker per session; nsjail runs unprivileged via user namespaces (no
# CAP_SYS_ADMIN, not --privileged).
required = true
nsjail_version = "3.6"
nsjail_source = "https://github.com/google/nsjail"
binary_path = "/usr/local/bin/nsjail"
# Per-jail PID namespace (O-A3): the jailed worker becomes PID 1, so killing
# the nsjail wrapper reaps the whole tree (including a CLI that escaped into
# its own process group) and a compromised agent can no longer signal the
# gateway or sibling sessions. A namespaced, read-only /proc is mounted with it.
clone_newpid = true

[isolation.mounts]
# Per-session tmpfs size for the jail's /tmp (MiB). Default 256; bounds each
# session's /tmp usage independently.
# tmpfs_size_mib = 256
workspace_dir = "/workspace"
agent_home_dir = "/agent-home"
tmp_dir = "/tmp"

[isolation.rlimits]
max_open_files = 1024
max_processes = 256
# Cap on any single file a jailed agent may write (RLIMIT_FSIZE) — bounds
# runaway files inside the writable workspace/agent-home. 0 = unlimited.
# max_file_bytes = 1073741824

[isolation.user_namespace]
enabled = true
uid = 65532
gid = 65532

[isolation.seccomp]
policy = "kafel"

# --- Agents ----------------------------------------------------------------
# The three agents default to DISABLED: the base image ships no agent CLIs, so
# /v1/models advertises nothing until an operator enables an agent AND provides
# its CLI. To make an agent available:
#   1. install its CLI (see docker/Dockerfile.agents or a derived image), then
#   2. set `enabled = true` AND `command` to the installed binary (argv array).
# The gateway probes the executable (exec.LookPath on argv[0]) before
# advertising it. The command is executed verbatim — never through a shell —
# so paths with spaces and extra flags are expressed as array elements. A
# single string is still accepted for one deprecation window, interpreted as
# ONE executable path (the whole string is argv[0], never shell syntax —
# arguments must migrate to the array form); a future release rejects it.

[agents.codex]
enabled = false
# command = ["codex"]
permission = "auto"
# Forward the caller's system role messages into the native prompt each turn.
# Default false: system messages are ignored so a client cannot pollute the
# agent's own tool/skill surface. Set true to prepend them before the user turn.
# inject_system_prompt = false

[agents.claude-code]
enabled = false
# command = ["claude"]
permission = "auto"
default_model = "sonnet"
models = ["sonnet", "opus", "haiku"]
# inject_system_prompt = false

[agents.kimi]
enabled = false
command = ["kimi"]
permission = "auto"
# Per-agent turn bound (O-F09b): honored by EVERY adapter at the worker
# boundary. Zero falls back to server.turn_timeout. When the deadline fires
# the worker aborts the native turn and the API answers with a unified
# timeout error (HTTP 504 / SSE error frame, code "turn_timeout").
timeout = "30m"
models = ["kimi-k3", "deepseek-v4-flash"]
# inject_system_prompt = false
