# agent-cli-gateway configuration. Run `gateway -config gateway.toml`, or omit
# --config for built-in defaults (prod profile, isolation required).
# See README.md for the full field reference.

# Runtime profile: "prod" (default), "dev", or "test". nsjail isolation is
# mandatory in prod and dev; only the "test" profile may disable it
# (isolation.required = false).
mode = "prod"

[server]
listen_addr = ":4096"
drain_timeout = "30s"
# HTTP listener hardening (O-F07): bound slow-header/keep-alive abuse without
# breaking long-lived SSE turns (WriteTimeout/ReadTimeout are deliberately unset).
read_header_timeout = "10s"
idle_timeout = "60s"
max_header_bytes = 1048576

[worker]
stop_grace_period = "10s"
heartbeat_interval = "15s"
heartbeat_timeout = "3s"
heartbeat_failures = 3

[sessions]
# Reclaims only the disposable Worker/Agent process. Gateway conversation
# identity and the native session ID remain available for recovery.
idle_timeout = "2h"
reap_interval = "1m"
# How long a session record (and its native session ID) is retained after the
# last activity before the background prune loop evicts it and drops its cached
# worker handle. MUST exceed idle_timeout so a record survives worker
# reclamation and can still resume. Default 168h.
record_ttl = "168h"

[auth]
# Tokens authenticate callers, not end users. Health probes are always
# unauthenticated. Production requires at least one caller.
callers = [{ id = "example-client", tokens = ["change-me"] }]

[workspace]
# Directory all opaque workspace_ids resolve under. Only the server owns this
# path; clients reference workspaces by opaque ID and can never inject a path.
root = "/srv/workspaces"

[isolation]
# nsjail sandbox boundary (phase 1). The gateway forks one nsjail-wrapped
# worker per session; nsjail runs unprivileged via user namespaces (no
# CAP_SYS_ADMIN, not --privileged).
required = true
nsjail_version = "3.6"
nsjail_source = "https://github.com/google/nsjail"
binary_path = "/usr/local/bin/nsjail"
# Per-jail PID namespace (O-A3): the jailed worker becomes PID 1, so killing
# the nsjail wrapper reaps the whole tree (including a CLI that escaped into
# its own process group) and a compromised agent can no longer signal the
# gateway or sibling sessions. A namespaced, read-only /proc is mounted with it.
clone_newpid = true

[isolation.mounts]
workspace_dir = "/workspace"
agent_home_dir = "/agent-home"
tmp_dir = "/tmp"

[isolation.rlimits]
max_open_files = 1024
max_processes = 256

[isolation.user_namespace]
enabled = true
uid = 65532
gid = 65532

[isolation.seccomp]
policy = "kafel"

# --- Agents ----------------------------------------------------------------
# The three agents default to DISABLED: the base image ships no agent CLIs, so
# /v1/models advertises nothing until an operator enables an agent AND provides
# its CLI. To make an agent available:
#   1. install its CLI (see docker/Dockerfile.agents or a derived image), then
#   2. set `enabled = true` AND `command` to the installed binary's name/path.
# The gateway probes that command (exec.LookPath) before advertising it.

[agents.codex]
enabled = false
# command = "codex"
permission = "auto"
# Forward the caller's system role messages into the native prompt each turn.
# Default false: system messages are ignored so a client cannot pollute the
# agent's own tool/skill surface. Set true to prepend them before the user turn.
# inject_system_prompt = false

[agents.claude-code]
enabled = false
# command = "claude"
permission = "auto"
default_model = "sonnet"
models = ["sonnet", "opus", "haiku"]
# inject_system_prompt = false

[agents.kimi]
enabled = false
command = "kimi"
permission = "auto"
# Per-agent turn bound. Only the kimi adapter honors agents.<id>.timeout today;
# configuring it on codex or claude-code fails closed at startup until the
# unified turn-deadline contract lands.
timeout = "30m"
models = ["kimi-k3", "deepseek-v4-flash"]
# inject_system_prompt = false
